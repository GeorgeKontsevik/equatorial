[project]
name = "equatorial"
version = "0.1.0"
description = "Equatorial transport-climate-agriculture data tooling for full-year equatorial belt fetch, overlay, and crop accessibility analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdsapi",
    "duckdb",
    "geopandas",
    "gcsfs",
    "geoalchemy2",
    "httpx",
    "jupyter",
    "matplotlib",
    "notebook",
    "openpyxl",
    "pandas",
    "pyarrow",
    "pycountry",
    "psycopg[binary]",
    "pyyaml",
    "rasterio",
    "shapely",
    "sqlalchemy",
    "xarray",
    "zarr",
]

[project.scripts]
equatorial-fetch-data = "src.data.fetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
