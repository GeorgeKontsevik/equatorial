[project]
name = "equatorial"
version = "0.1.0"
description = "Equatorial transport-climate-agriculture data tooling, including reproducible raw-data acquisition and the Bolivia sample workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdsapi",
    "geopandas",
    "httpx",
    "jupyter",
    "matplotlib",
    "notebook",
    "openpyxl",
    "pandas",
    "pycountry",
    "pyyaml",
    "rasterio",
    "shapely",
    "xarray",
]

[project.scripts]
bolivia-sample-task = "bolivia_sample_task_i:main"
equatorial-fetch-data = "src.data.fetch:main"
equatorial-inspect-data = "src.data.inspect:main"
equatorial-render-country-previews = "src.data.render_country_previews:main"
equatorial-road-scenarios = "src.data.run_road_monthly_scenarios:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
