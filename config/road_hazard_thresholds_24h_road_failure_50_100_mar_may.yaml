road_hazard_thresholds:
  version: 0.1
  status: provisional_24h_road_failure_50_100_mar_may
  source_config: config/road_hazard_impact_curves.yaml
  note: >
    Rainfall road-failure rerun using weekly maximum daily precipitation total:
    `chirps_24h_max_weekly_mm` in mm/day. This encodes the 50-100 mm/day
    rainfall -> road failures range as a severity transition: speed reduction
    starts at 50 mm/day, and temporary one-week road closure starts at
    100 mm/day.

  rules:
    - factor: chirps_24h_max_weekly_mm
      direction: gte
      surface_scope: all
      thresholds:
        minor: 50.0
        moderate: null
        severe: 100.0
        catastrophic: null
      effects:
        minor:
          speed_penalty_fraction: 0.15
          closure_weeks: null
        severe:
          speed_penalty_fraction: null
          closure_weeks: 1
