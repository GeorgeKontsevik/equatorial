global:
  data_root: data
  timeout_seconds: 120
  max_retries: 3
  user_agent: equatorial-data-fetch/0.1.0

datasets:
  # Minimal ERA5 smoke config:
  # - single city window (Santa Cruz de la Sierra area)
  # - one summer month in Bolivia (January)
  era5:
    enabled: true
    dataset_id: reanalysis-era5-land-monthly-means
    target_filename: era5-land-monthly-santa-cruz-2024-01.nc
    spatial_resolution_raw: 0.1 degree grid
    temporal_resolution: monthly
    bbox: [-63.4, -18.0, -62.9, -17.6]
    request:
      product_type: monthly_averaged_reanalysis
      variable:
        - total_precipitation
      year: ["2024"]
      month: ["01"]
      time: "00:00"
      data_format: netcdf
      download_format: unarchived
      # CDS area order: North, West, South, East
      area: [-17.6, -63.4, -18.0, -62.9]
