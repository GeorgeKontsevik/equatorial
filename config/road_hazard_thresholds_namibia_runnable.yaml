road_hazard_thresholds:
  version: 1.0
  status: runnable_subset_from_road_hazard_mapping_rebuilt
  source_workbook: config/road_hazard_mapping_rebuilt.xlsx
  source_table: config/weekly_hazard_thresholds_strict.csv
  source_key: config/road_hazard_source_key.csv
  note: Namibia-compatible runnable subset rebuilt from Mapping_Rebuilt. Old landslide/universal 24h road-failure rows are
    intentionally not carried forward.
  threshold_slots:
    speed_reduction_1:
      effect_type: speed_penalty
      speed_penalty_fraction: 0.1
    speed_reduction_2:
      effect_type: speed_penalty
      speed_penalty_fraction: 0.25
    speed_reduction_3:
      effect_type: speed_penalty
      speed_penalty_fraction: 0.4
    catastrophic_temporary:
      effect_type: temporary_closure
      closure_weeks: 1
    catastrophic_permanent:
      effect_type: permanent_closure
      closure_weeks: 5200
  rules:
  - hazard: extreme_rainfall_operational
    surface: paved
    source_row: 'Mapping_Rebuilt: extreme_rainfall_operational/paved'
    factor: era5_tp_1h_max_weekly_mm_per_h
    direction: gte
    surface_scope: paved
    current_status: active_operational_speed_only
    thresholds:
      speed_reduction_1: 6.35
      speed_reduction_2: 20.0
      speed_reduction_3: 30.0
      catastrophic_temporary: null
      catastrophic_permanent: null
    effects:
      speed_reduction_1:
        speed_penalty_fraction: 0.07
        closure_weeks: null
      speed_reduction_2:
        speed_penalty_fraction: 0.2
        closure_weeks: null
      speed_reduction_3:
        speed_penalty_fraction: 0.35
        closure_weeks: null
  - hazard: flood_extent_binary_proxy
    surface: paved
    source_row: 'Mapping_Rebuilt: flood_extent_binary_proxy/paved'
    factor: flood_weekly
    direction: gte
    surface_scope: paved
    current_status: active_binary_operational_closure_proxy_no_depth_damage
    thresholds:
      speed_reduction_1: null
      speed_reduction_2: null
      speed_reduction_3: null
      catastrophic_temporary: 1.0
      catastrophic_permanent: null
    effects:
      catastrophic_temporary:
        speed_penalty_fraction: null
        closure_weeks: 1
  - hazard: flood_extent_binary_proxy
    surface: unpaved
    source_row: 'Mapping_Rebuilt: flood_extent_binary_proxy/unpaved'
    factor: flood_weekly
    direction: gte
    surface_scope: unpaved
    current_status: active_binary_operational_closure_proxy_no_depth_damage
    thresholds:
      speed_reduction_1: null
      speed_reduction_2: null
      speed_reduction_3: null
      catastrophic_temporary: 1.0
      catastrophic_permanent: null
    effects:
      catastrophic_temporary:
        speed_penalty_fraction: null
        closure_weeks: 1
  - hazard: wind_crosswind
    surface: paved
    source_row: 'Mapping_Rebuilt: wind_crosswind/paved'
    factor: era5_crosswind_10m_weekly_max_m_s
    direction: gte
    surface_scope: paved
    current_status: active_operational_restriction_only_no_treefall_closure
