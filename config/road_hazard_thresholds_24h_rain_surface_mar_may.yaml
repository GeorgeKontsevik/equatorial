road_hazard_thresholds:
  version: 0.1
  status: provisional_24h_rain_surface_mar_may
  source_config: config/road_hazard_impact_curves.yaml
  note: >
    Rain-only rerun using weekly maximum daily precipitation total:
    `chirps_24h_max_weekly_mm` in mm/24h. This excludes ERA5 1-hour
    rainfall intensity. Unpaved-road direct rain/runoff uses the audited
    alternate event-depth anchors from the impact-curve config; paved-road
    short-duration intensity thresholds are not included because they are
    mm/h anchors, not 24h totals.

  rules:
    - factor: chirps_24h_max_weekly_mm
      direction: gte
      surface_scope: unpaved
      thresholds:
        minor: 6.0
        moderate: 10.0
        severe: null
        catastrophic: null
      effects:
        minor:
          speed_penalty_fraction: 0.05
          closure_weeks: null
        moderate:
          speed_penalty_fraction: 0.15
          closure_weeks: null

    - factor: chirps_24h_max_weekly_mm
      direction: gte
      surface_scope: all
      condition:
        factor: landslide_susceptibility
        operator: gte
        value: 3.0
      thresholds:
        minor: 140.0
        moderate: 250.0
        severe: 300.0
        catastrophic: null
      effects:
        minor:
          speed_penalty_fraction: 0.05
          closure_weeks: null
        moderate:
          speed_penalty_fraction: 0.15
          closure_weeks: null
        severe:
          speed_penalty_fraction: null
          closure_weeks: 1
